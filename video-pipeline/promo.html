<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<script src="node_modules/katex/dist/katex.min.js"></script>
<style>
:root{--red:#d7191f;--red2:#b5121a;--ink:#1d2030;--muted:#6b7080;--bg:#fff6f3;--gold:#ffb300;--green:#13a065;--chip:#f2f3f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:2400px;overflow:hidden;font-family:"Noto Sans SC",sans-serif;color:var(--ink);
  background:radial-gradient(circle at 12% 30%,rgba(215,25,31,.05) 0 2px,transparent 3px) 0 0/44px 44px,var(--bg)}
.katex{font-size:1.06em}
#head{position:absolute;left:0;top:0;width:1080px;height:400px;background:linear-gradient(120deg,#e3262c 0%,#c8121a 55%,#a90e15 100%);overflow:hidden}
#head::before{content:"";position:absolute;right:-160px;top:-220px;width:620px;height:620px;border-radius:50%;background:rgba(255,255,255,.08)}
#head::after{content:"";position:absolute;left:-120px;bottom:-260px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.06)}
#brand{position:absolute;left:60px;top:58px;font-size:32px;font-weight:900;color:#fff;letter-spacing:3px}
#brand span{font-weight:500;opacity:.85;margin-left:14px;letter-spacing:1px}
#title{position:absolute;left:60px;top:116px;font-size:104px;font-weight:900;color:#fff;letter-spacing:4px;text-shadow:0 6px 0 rgba(0,0,0,.12)}
#subtitle{position:absolute;left:60px;top:268px;font-size:38px;font-weight:900;color:#5a2600;background:var(--gold);border-radius:40px;padding:8px 28px}
#avatar{position:absolute;right:56px;top:48px;width:236px;height:236px;border-radius:50%;border:7px solid #fff;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#avatar img{width:100%;height:100%;object-fit:cover}
#tname{position:absolute;right:56px;top:296px;width:236px;text-align:center;color:#fff;font-size:32px;font-weight:900}
#tname small{display:block;font-size:22px;font-weight:500;opacity:.9}
#prog{position:absolute;left:60px;top:432px;width:960px;display:flex;gap:16px}
#prog .seg{flex:1;height:64px;border-radius:32px;background:#fff;box-shadow:0 4px 14px rgba(200,20,30,.08);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#b9bcc6}
#prog .seg i{position:absolute;inset:0;background:linear-gradient(90deg,#e3262c,#ff5a3c);transform-origin:left;transform:scaleX(0)}
#prog .seg b{position:relative}
#stage{position:absolute;left:0;top:540px;width:1080px;height:1400px;overflow:hidden}
.scene{position:absolute;left:0;top:0;width:1080px;height:1400px;padding:10px 48px;opacity:0}
.card{background:#fff;border-radius:36px;box-shadow:0 14px 40px rgba(180,20,30,.10);padding:46px 48px 42px;position:relative}
.qhead{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.qnum{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--red2)}
.topic{font-size:40px;font-weight:900;color:var(--red);background:#ffe9e8;border-radius:40px;padding:6px 30px}
.stars{font-size:40px;color:var(--gold);letter-spacing:4px}
.qtext{font-size:46px;line-height:1.8;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:22px;font-size:44px;font-weight:500}
.opt{display:flex;align-items:center;gap:18px;padding:8px 16px;border-radius:20px;border:4px solid transparent}
.opt em{font-style:normal;width:60px;height:60px;border-radius:50%;border:3px solid #f2b8b8;color:var(--red);font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.opt.right{border-color:var(--green);background:#eafaf2}
.opt.right em{background:var(--green);border-color:var(--green);color:#fff}
.ansrow{display:flex;align-items:center;justify-content:center;margin:26px 0 0;height:220px}
.ans{position:relative;transform:rotate(-6deg);border:10px solid var(--red);border-radius:30px;padding:16px 56px 20px;color:var(--red);text-align:center;background:rgba(255,255,255,.9);box-shadow:0 0 0 6px rgba(215,25,31,.12)}
.ans small{display:block;font-size:34px;font-weight:900;letter-spacing:10px}
.ans b{display:block;font-size:100px;font-weight:900;line-height:1.05}
.ans b .katex{font-size:1em}
.pts{margin-top:24px}
.pts .lab{font-size:36px;font-weight:900;color:var(--muted);margin-bottom:18px}
.pts .row{display:flex;flex-wrap:wrap;gap:18px}
.chip{font-size:40px;font-weight:900;background:var(--chip);color:#343846;border-radius:40px;padding:12px 32px;border:3px solid #e3e5ea}
.chip.hot{background:#fff1f0;border-color:#ffb3ad;color:var(--red2)}
.teaser{margin-top:30px;background:linear-gradient(90deg,#ffcc33,#ffa21a);color:#4a2200;font-size:40px;font-weight:900;border-radius:26px;padding:22px 30px;text-align:center;box-shadow:0 10px 24px rgba(255,160,0,.3)}
/* intro */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px}
.intro .l1{font-size:96px;font-weight:900;color:var(--ink)}
.intro .l1 span{color:var(--red)}
.intro .l2{margin-top:40px;font-size:64px;font-weight:900;color:#fff;background:var(--red);border-radius:24px;padding:16px 46px;box-shadow:0 10px 0 var(--red2)}
.intro .cards{display:flex;gap:34px;margin-top:120px}
.intro .mini{width:290px;height:400px;border-radius:30px;background:#fff;box-shadow:0 14px 34px rgba(180,20,30,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.intro .mini b{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;font-size:64px;font-weight:900;display:flex;align-items:center;justify-content:center}
.intro .mini span{font-size:40px;font-weight:900}
.intro .mini i{font-style:normal;font-size:56px;font-weight:900;color:#d4d6dc}
/* outro */
.outro .hl1{font-size:70px;font-weight:900;line-height:1.3;text-align:center;margin-top:20px}
.outro .hl1 span{color:var(--red)}
.outro .list{margin:44px auto 0;width:900px;display:flex;flex-direction:column;gap:22px}
.outro .it{background:#fff;border-radius:26px;padding:22px 32px;font-size:44px;font-weight:900;display:flex;align-items:center;gap:20px;box-shadow:0 8px 22px rgba(180,20,30,.09)}
.outro .it em{font-style:normal;background:var(--red);color:#fff;border-radius:16px;padding:4px 18px;font-size:36px}
.outro .it span{color:var(--red2)}
.outro .hero{position:absolute;left:0;bottom:0;width:1080px;height:760px}
.outro .hero .disc{position:absolute;left:-90px;bottom:-200px;width:760px;height:760px;border-radius:50%;background:linear-gradient(150deg,#ff5b4d,#c8121a)}
.outro .hero img{position:absolute;left:10px;bottom:0;height:720px}
.outro .cta{position:absolute;right:48px;bottom:250px;width:500px;text-align:center}
.outro .cta .w{font-size:46px;font-weight:900;line-height:1.4}
.outro .cta .w b{display:block;font-size:64px;color:var(--red)}
.outro .btn{position:absolute;right:48px;bottom:90px;width:500px;height:130px;border-radius:65px;background:linear-gradient(90deg,#ff3d2e,#d7191f);color:#fff;font-size:52px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(215,25,31,.35)}
#subwrap{position:absolute;left:40px;width:1000px;top:1960px;height:190px;display:flex;align-items:center;justify-content:center}
#sub{background:rgba(25,28,40,.88);color:#fff;font-size:44px;line-height:1.45;font-weight:700;border-radius:26px;padding:16px 34px;text-align:center;max-width:1000px}
#sub .who{display:inline-block;font-size:28px;font-weight:700;border-radius:10px;padding:0 12px;margin-right:14px;vertical-align:5px;background:#2f6fe8}
#foot{position:absolute;left:0;bottom:0;width:1080px;height:220px;background:#24262f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#foot .t{font-size:40px;font-weight:900}
#foot .t span{color:var(--gold)}
#foot .n{font-size:24px;opacity:.7}
</style></head>
<body>
<div id="head">
  <div id="brand">有道领世<span>高一数学</span></div>
  <div id="title">高一入营测</div>
  <div id="subtitle">3 道题 · 答案速览</div>
  <div id="avatar"><img id="avimg"></div>
  <div id="tname">胡源老师<small>北大元培 · 高考状元</small></div>
</div>
<div id="prog"></div>
<div id="stage"></div>
<div id="subwrap"><div id="sub"></div></div>
<div id="foot"><div class="t">胡源老师 · <span>高一数学体验课</span></div><div class="n" id="note"></div></div>
<script>
const tex=s=>s.replace(/\$([^$]+)\$/g,(m,t)=>katex.renderToString(t,{throwOnError:false,strict:false}));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let TL, scenes=[], acts=[];
function sceneHTML(s,i){
  if(s.type==='intro') return `<div class="scene intro" id="s${i}"><div class="l1">入营测 <span>做完了吗？</span></div><div class="l2">3 道题答案 · 马上揭晓</div>
    <div class="cards">${s.cards.map((c,k)=>`<div class="mini c${k+1}"><b>${k+1}</b><span>${c}</span><i>?</i></div>`).join('')}</div></div>`;
  if(s.type==='q') return `<div class="scene" id="s${i}"><div class="card">
    <div class="qhead"><div class="qnum">${s.num}</div><div class="topic">${s.topic}</div><div class="stars">${'★'.repeat(s.stars||0)}</div></div>
    <div class="qtext" style="${s.qsize?`font-size:${s.qsize}px`:''}">${tex(s.problem)}</div>
    ${s.options?`<div class="opts">${s.options.map(o=>`<div class="opt o${o[0]}"><em>${o[0]}</em><span>${tex(o[1])}</span></div>`).join('')}</div>`:''}
    <div class="ansrow"><div class="ans"><small>答案</small><b>${tex(s.answer)}</b></div></div>
    <div class="pts"><div class="lab">✦ 考察知识点</div><div class="row">${s.points.map((p,k)=>`<div class="chip p${k+1}">${p}</div>`).join('')}</div></div>
    <div class="teaser">${s.teaser}</div></div></div>`;
  if(s.type==='outro') return `<div class="scene outro" id="s${i}"><div class="hl1">${s.headline}</div>
    <div class="list">${s.items.map((t,k)=>`<div class="it i${k+1}"><em>${k+1}</em>${t}</div>`).join('')}</div>
    <div class="hero"><div class="disc"></div><img src="${TL.portrait}"></div>
    <div class="cta"><div class="w">欢迎来到<b>胡源老师</b>高一数学体验课</div></div><div class="btn">进入体验课 ▶</div></div>`;
}
window.setup=function(tl){
  TL=tl;
  document.getElementById('avimg').src=tl.avatar;
  document.getElementById('note').textContent=tl.note||'';
  const nq=tl.scenes.filter(s=>s.type==='q').length;
  document.getElementById('prog').innerHTML=Array.from({length:nq},(_,k)=>`<div class="seg"><i></i><b>第 ${k+1} 题</b></div>`).join('');
  const st=document.getElementById('stage');
  tl.scenes.forEach((s,i)=>{st.insertAdjacentHTML('beforeend',sceneHTML(s,i));scenes.push({s,el:document.getElementById('s'+i)})});
  for(const a of tl.actions){const el=document.querySelector(`#s${a.scene} ${a.sel}`); if(el) acts.push({a,el})}
};
function fx(el,kind,p){ // p<=0 hidden, p>=1 settled
  if(kind==='right'){el.classList.toggle('right',p>0);return}   // marks the correct option; never hides it
  if(p<=0){el.style.opacity=0;return}
  const q=clamp(p);
  if(kind==='stamp'){el.style.opacity=clamp(q*4);el.style.transform=`rotate(-6deg) scale(${q<1?2.2-1.2*ease(q)+(q>.7?Math.sin((q-.7)*30)*0.04*(1-q):0):1})`}
  else if(kind==='pop'){el.style.opacity=clamp(q*3);el.style.transform=`scale(${back(q)})`}
  else if(kind==='up'){el.style.opacity=clamp(q*2);el.style.transform=`translateY(${(1-ease(q))*60}px)`}
  else if(kind==='slide'){el.style.opacity=clamp(q*2);el.style.transform=`translateX(${(1-ease(q))*-120}px)`}
  else {el.style.opacity=q}
}
window.render=function(t){
  // scenes: slide in from the right, slide out to the left
  for(const {s,el} of scenes){
    const pin=(t-s.t)/0.45, pout=(t-(s.e-0.35))/0.35;
    if(t<s.t||t>s.e+0.05){el.style.opacity=0;continue}
    const x=pin<1?(1-ease(pin))*1080:(pout>0?-ease(pout)*1080:0);
    el.style.opacity=pin<1?clamp(pin*1.5):(pout>0?1-clamp(pout):1);
    el.style.transform=`translateX(${x}px)`;
  }
  for(const {a,el} of acts) fx(el,a.fx,(t-a.t)/(a.d||0.45));
  // progress: a question segment fills while its scene is on screen
  const segs=document.querySelectorAll('#prog .seg'); let qi=0;
  for(const {s} of scenes){ if(s.type!=='q')continue; const seg=segs[qi++];
    const f=t<s.t?0:clamp((t-s.t)/0.5); seg.querySelector('i').style.transform=`scaleX(${ease(f)})`; seg.style.color=f>0.5?'#fff':'#b9bcc6'}
  // CTA button pulse
  const btn=document.querySelector('.outro .btn'); if(btn){const o=scenes.find(x=>x.s.type==='outro').s; const k=t-o.t; btn.style.transform=`scale(${k>0?1+0.04*Math.sin(k*6):1})`}
  // subtitles
  const sub=document.getElementById('sub'); let cur=null;
  for(const s of TL.subs){if(t>=s.t&&t<s.e){cur=s;break}}
  if(cur){sub.style.opacity=1; if(sub._k!==cur.k){sub.innerHTML=(cur.who?`<span class="who">${cur.who}</span>`:'')+tex(cur.text);sub._k=cur.k}} else sub.style.opacity=0;
};
</script>
</body></html>
